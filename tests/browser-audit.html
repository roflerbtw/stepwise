<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stepwise accessibility audit</title>
  </head>
  <body>
    <h1>Stepwise accessibility audit</h1>
    <button id="run" disabled>Run audit</button>
    <pre id="report" role="status">Ready</pre>
    <iframe
      title="Stepwise preview"
      src="../"
      style="width: 100%; height: 900px; border: 0"
    ></iframe>
    <script>
      const frame = document.querySelector("iframe");
      frame.onload = () => {
        const script = frame.contentDocument.createElement("script");
        script.src = "node_modules/axe-core/axe.min.js";
        script.onload = () => (document.querySelector("#run").disabled = false);
        frame.contentDocument.body.append(script);
      };
      document.querySelector("#run").onclick = async () => {
        document.querySelector("#report").textContent = "Running";
        const report = await frame.contentWindow.axe.run();
        document.querySelector("#report").textContent = JSON.stringify(
          {
            violations: report.violations.map((v) => ({
              id: v.id,
              nodes: v.nodes.map((n) => ({
                target: n.target,
                summary: n.failureSummary,
              })),
            })),
            incomplete: report.incomplete.map((v) => v.id),
            passes: report.passes.length,
          },
          null,
          2,
        );
      };
    </script>
  </body>
</html>
